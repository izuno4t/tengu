name: coverage

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  core-coverage:
    name: core coverage
    runs-on: ubuntu-latest
    env:
      COVERAGE_MIN_LINES: "80"
      COVERAGE_IGNORE_REGEX: "src/(tui/.*|llm/(anthropic|google|openai|ollama)\\.rs|mcp/(http|stdio)\\.rs)"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Check core coverage
        run: scripts/coverage.sh summary
